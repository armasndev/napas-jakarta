[project]
name = "napas-jakarta"
version = "0.1.0"
description = "A citation-grounded Jakarta air-quality assistant."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "psycopg[binary]>=3.2,<4",
  "qdrant-client>=1.12,<1.14",
  "Pillow>=10,<13",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
llm = ["openai>=1.50,<2"]
retrieval = ["sentence-transformers>=3,<4"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
