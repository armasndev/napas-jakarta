services:
  - type: web
    name: napas-jakarta
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.api:app --host 0.0.0.0 --port=$PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8502"
      - key: SOURCE_DATA_URL
        value: https://udara.jakarta.go.id/
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: LLM_MODEL
        value: claude-haiku-4-5-20251001
      - key: RETRIEVAL_MODE
        value: hybrid
      - key: HISTORICAL_AIR_URL
        value: https://air-quality-api.open-meteo.com/v1/air-quality
      - key: POSTGRES_DSN
        sync: false
      - key: QDRANT_URL
        sync: false
# No Render cron service is declared here. Render's cron service is not part
# of the free web tier and could create an accidental bill. Use Railway's
# separate cron service with `python -m ingestion.railway_cron`, or run the
# same command from an explicitly paid scheduler if Render is selected later.
