services:
  app:
    build: .
    ports:
      - "8502:8502"
    environment:
      DATA_DIR: /app/data
      POSTGRES_DSN: postgresql://napas:napas@postgres:5432/napas
      QDRANT_URL: http://qdrant:6333
      SOURCE_DATA_URL: ${SOURCE_DATA_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
    depends_on:
      ingest:
        condition: service_completed_successfully
      index:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
      POSTGRES_DSN: postgresql://napas:napas@postgres:5432/napas
      QDRANT_URL: http://qdrant:6333
      SOURCE_DATA_URL: ${SOURCE_DATA_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LLM_MODEL: ${LLM_MODEL:-claude-haiku-4-5-20251001}
    depends_on:
      ingest:
        condition: service_completed_successfully
      index:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
  ingest:
    build: .
    command: ["sh", "-c", "python -m ingestion.flow && python -m ingestion.historical"]
    environment:
      POSTGRES_DSN: postgresql://napas:napas@postgres:5432/napas
      SOURCE_DATA_URL: ${SOURCE_DATA_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
  index:
    build: .
    command: ["python", "-m", "ingestion.build_index", "--qdrant-url", "http://qdrant:6333", "--hybrid"]
    environment:
      SOURCE_DATA_URL: ${SOURCE_DATA_URL:-}
    depends_on:
      ingest:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: napas
      POSTGRES_PASSWORD: napas
      POSTGRES_DB: napas
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./monitoring/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U napas -d napas"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    image: docker.io/qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10
  grafana:
    image: docker.io/grafana/grafana:11.3.0
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
volumes:
  postgres_data:
  qdrant_data:
