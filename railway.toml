# Default Railway service configuration: deploy this service as the private
# FastAPI data/tool boundary. The public UI is the separate web service under
# web/. The ingestion service uses the same image with the command documented
# in docs/deployment-railway.md and should not use this HTTP start command.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["alembic", "upgrade", "head"]
startCommand = "uvicorn app.api:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
