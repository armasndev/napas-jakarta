# Apply this file only to the separate Railway cron service. It uses the same
# Python API image but never starts an HTTP listener.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m ingestion.railway_cron"
cronSchedule = "0 * * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 2
