# Apply this file only to a separate Railway cron service for the hourly news poll.
# Same Python image as the API; it never starts an HTTP listener.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["alembic", "upgrade", "head"]
startCommand = "python -m ingestion.railway_news_cron"
cronSchedule = "0 * * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1
